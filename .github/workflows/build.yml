# Сборка и тесты OpenData IDE на реальном DataGrip + PostgreSQL 16.
# На тег v* дополнительно публикуется GitHub Release с плагином.
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DATAGRIP_VERSION: "2026.2.6"
  OPENDATA_PG_URL: jdbc:postgresql://localhost:54329/opendata
  OPENDATA_PG_USER: opendata
  OPENDATA_PG_PASSWORD: opendata

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opendata
          POSTGRES_USER: opendata
          POSTGRES_PASSWORD: opendata
        ports: [ "54329:5432" ]
        options: >-
          --health-cmd "pg_isready -U opendata -d opendata"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache DataGrip
        id: dg-cache
        uses: actions/cache@v4
        with:
          path: ~/jb/DataGrip-${{ env.DATAGRIP_VERSION }}
          key: datagrip-${{ env.DATAGRIP_VERSION }}

      - name: Download DataGrip ${{ env.DATAGRIP_VERSION }}
        if: steps.dg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/jb
          curl -sSL "https://download.jetbrains.com/datagrip/datagrip-${DATAGRIP_VERSION}.tar.gz" | tar xz -C ~/jb

      - name: Init test database
        env:
          PGPASSWORD: opendata
        run: psql -h localhost -p 54329 -U opendata -d opendata -v ON_ERROR_STOP=1 -q -f docker/postgres/init/01-opendata.sql

      - name: Research (stage 0) + compatibility check
        run: |
          export JETBRAINS_IDE_HOME=~/jb/DataGrip-${DATAGRIP_VERSION}
          bash scripts/research.sh "$JETBRAINS_IDE_HOME"

      - name: Build + tests
        run: ./gradlew --console=plain -PlocalIdePath=$HOME/jb/DataGrip-${DATAGRIP_VERSION} :opendata:integration:buildPlugin :opendata:integration:test

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: opendata/integration/build/test-results/test/*.xml

      - name: Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendata-integration
          path: opendata/integration/build/distributions/*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" opendata/integration/build/distributions/*.zip \
            --title "OpenData IDE $GITHUB_REF_NAME" --notes-file docs/release-notes.md
