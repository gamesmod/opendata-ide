group=io.opendata
version=0.1.0

# --- Версии инструментов сборки -------------------------------------------------------------
# Перед первой сборкой сверить с docs/compatibility-matrix.md и при необходимости обновить
# до актуальных (IntelliJ Platform Gradle Plugin 2.x, Kotlin не новее stdlib в целевой IDE).
kotlinVersion=2.4.20
intellijPlatformPluginVersion=2.19.0

# --- Целевая платформа ----------------------------------------------------------------------
# Основной режим (ТЗ 8.1/8.2): локальная установка IDE/DataGrip —
#   -PlocalIdePath=<path> или переменные окружения JETBRAINS_IDE_HOME / DATAGRIP_HOME.
# Запасной режим (если локальная IDE не задана): загрузка платформы из репозитория JetBrains.
#   IU — IntelliJ IDEA (Ultimate / unified distribution), DB — DataGrip.
platformType=DB
platformVersion=2026.2
# Минимальный baseline (первые три цифры build number). Берётся из docs/compatibility-matrix.md.
pluginSinceBuild=262

# Плагин использует Kotlin stdlib, поставляемый IDE.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
