group=io.opendata
version=0.4.0

# --- Версии инструментов сборки -------------------------------------------------------------
# Перед первой сборкой сверить с docs/compatibility-matrix.md и при необходимости обновить
# до актуальных (IntelliJ Platform Gradle Plugin 2.x, Kotlin не новее stdlib в целевой IDE).
kotlinVersion=2.4.20
intellijPlatformPluginVersion=2.19.0

# --- Платформа ------------------------------------------------------------------------------
# Открытая сборка IntelliJ IDEA (Apache 2.0) из github.com/JetBrains/intellij-community/releases — база продукта.
# Путь к распакованной сборке: -PossIdePath=<dir> или OPENDATA_PLATFORM_HOME (scripts/build.* скачивают её сами).
ossPlatformVersion=2026.2.3
# Минимальный baseline платформы для плагина OpenData (первые три цифры build number).
pluginSinceBuild=262

# Плагин использует Kotlin stdlib, поставляемый IDE.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
